<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>回路残响 · 灰盒手感原型</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:#ddd;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block;width:100vw;height:100vh}
  #panel{position:fixed;top:8px;right:8px;width:300px;max-height:calc(100vh - 16px);overflow:auto;background:rgba(18,19,24,.94);border:1px solid #3a3d46;border-radius:8px;padding:8px 12px 12px;font-size:12px;display:none;z-index:5}
  #panel h3{margin:4px 0 8px;font-size:14px;color:#fff}
  #panel h3 small{color:#888;font-weight:normal;margin-left:6px}
  #panel label{display:grid;grid-template-columns:118px 1fr 44px;align-items:center;gap:6px;margin:3px 0}
  #panel input{width:100%}
  #panel b{font-weight:normal;color:#8fd3ff;text-align:right;font-variant-numeric:tabular-nums}
  #panel .grp{color:#9aa;margin:10px 0 2px;border-top:1px solid #333;padding-top:6px}
  #panel .btns{display:flex;gap:6px;margin-top:10px}
  #panel button{flex:1;background:#2b2f3a;color:#ddd;border:1px solid #4a4f5c;border-radius:5px;padding:6px;cursor:pointer}
  #panel button:hover{background:#363b48}
  #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,10,14,.72);z-index:6;cursor:pointer}
  #start .box{text-align:center;max-width:520px;padding:20px}
  #start h1{margin:0 0 6px;font-size:28px;color:#fff;letter-spacing:2px}
  #start p{color:#aab;margin:4px 0;line-height:1.7;font-size:14px}
  #start .k{display:inline-block;background:#2b2f3a;border:1px solid #4a4f5c;border-radius:4px;padding:0 6px;margin:0 2px;color:#fff;font-size:12px}
  #start .stages{display:flex;gap:10px;justify-content:center;margin:10px 0 14px}
  #start .stages button{background:#1b1f2b;color:#aab;border:1px solid #3a4050;border-radius:6px;padding:8px 14px;font-size:14px;cursor:pointer}
  #start .stages button.cur{border-color:#4fc3f7;color:#fff;background:#203048}
  #start .go{margin-top:16px;color:#4fc3f7;font-size:16px;animation:bl 1.2s infinite}
  @keyframes bl{50%{opacity:.35}}
  #touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:4}
  #pad{position:absolute;left:24px;bottom:24px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.15);pointer-events:auto}
  #knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.22)}
  #tbtns{position:absolute;right:20px;bottom:24px;display:grid;grid-template-columns:repeat(3,72px);gap:12px;pointer-events:auto}
  .tb{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
  .tb.on{background:rgba(79,195,247,.45)}
  #tbtns .tb:nth-child(3){transform:translateY(-36px)}
  #tchip{position:absolute;right:20px;bottom:150px;width:52px;height:52px;font-size:15px;pointer-events:auto}
  #tmag{position:absolute;right:84px;bottom:150px;width:52px;height:52px;font-size:15px;pointer-events:auto}
  #tset{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:8px;font-size:18px;pointer-events:auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel"></div>
<div id="touch">
  <div id="pad"><div id="knob"></div></div>
  <div id="tbtns"><div class="tb" data-a="dash">冲</div><div class="tb" data-a="shoot">射</div><div class="tb" data-a="jump">跳</div></div>
  <div class="tb" id="tset">⚙</div>
  <div class="tb" id="tchip">冰</div>
  <div class="tb" id="tmag">磁</div>
</div>
<div id="start"><div class="box">
  <h1>回路残响</h1>
  <div class="stages"><button data-s="frost">第一关 · 冰封钟楼</button><button data-s="function">第二关 · 坐标荒原</button></div>
  <p>移动 <span class="k">←→</span>/<span class="k">A D</span>　跳跃 <span class="k">Z</span>/<span class="k">K</span>/<span class="k">空格</span>（长按跳得更高）</p>
  <p>射击 <span class="k">X</span>/<span class="k">J</span>（长按蓄力）　冲刺 <span class="k">C</span>/<span class="k">L</span>/<span class="k">Shift</span></p>
  <p>贴墙按跳 = 蹬墙跳　冲刺中起跳 = 冲刺跳（保留速度）　<span class="k">↓</span>+跳 = 穿过薄平台</p>
  <p>打败 Boss 拿芯片：<span class="k">Q</span> 霜钟（水 ⇄ 冰）　<span class="k">E</span> 磁暴（吸附金属倒着走）</p>
  <p>测试用：数字键 <span class="k">1</span>~<span class="k">0</span> 直接传送到各存档点</p>
  <p><span class="k">Tab</span> 打开调参面板　<span class="k">R</span> 回到存档点　<span class="k">T</span> 从头开始　<span class="k">M</span> 静音　支持手柄</p>
  <div class="go">点击或按任意键开始</div>
</div></div>
<script>
'use strict';
// =====================================================================
//  常量与可调参数
// =====================================================================
const T = 16;                 // 图块尺寸（像素）
const STEP = 1 / 120;         // 固定物理步长：120Hz，与显示刷新率无关
const VIEW_H = 240;           // 视野高度（世界像素）
const MAXHP = 16;

const PARAM_DEFS = [
  ['g', '地面移动'],
  ['runSpeed', '奔跑速度', 60, 300, 5],
  ['groundAccel', '地面加速度', 300, 6000, 50],
  ['groundDecel', '地面摩擦(停下)', 300, 6000, 50],
  ['turnAccel', '转身加速度', 300, 9000, 50],
  ['g', '跳跃与空中'],
  ['jumpHeight', '最大跳跃高度px', 20, 140, 1],
  ['doubleJumpHeight', '二段跳高度px', 0, 120, 1],
  ['airJumps', '空中跳跃次数', 0, 3, 1],
  ['gravity', '重力', 500, 4000, 25],
  ['fallMult', '下落重力倍数', 1, 3, 0.05],
  ['jumpCut', '松键截断系数', 0.1, 1, 0.05],
  ['apexHang', '顶点滞空重力', 0.2, 1, 0.05],
  ['apexThreshold', '顶点判定速度', 0, 150, 5],
  ['maxFall', '最大下落速度', 150, 1000, 10],
  ['airAccel', '空中加速度', 100, 5000, 50],
  ['airDecel', '空中阻力', 0, 3000, 25],
  ['coyote', '土狼时间 s', 0, 0.3, 0.01],
  ['buffer', '跳跃缓冲 s', 0, 0.3, 0.01],
  ['cornerCorrect', '撞角修正 px', 0, 10, 1],
  ['g', '冲刺与墙'],
  ['dashSpeed', '冲刺速度', 150, 600, 10],
  ['dashTime', '冲刺时长 s', 0.05, 0.5, 0.01],
  ['wallSlide', '滑墙速度', 20, 300, 5],
  ['wallJumpX', '蹬墙水平速度', 50, 400, 5],
  ['wallJumpHeight', '蹬墙跳高度px', 10, 120, 1],
  ['wallLock', '蹬墙后控制削弱 s', 0, 0.4, 0.01],
  ['g', '镜头与打击感'],
  ['camLerp', '镜头跟随速度', 1, 25, 0.5],
  ['lookahead', '镜头前瞻 px', 0, 120, 2],
  ['hitstop', '顿帧强度', 0, 3, 0.1],
  ['shake', '震屏强度', 0, 3, 0.1],
];
const DEFAULTS = {
  runSpeed: 150, groundAccel: 1800, groundDecel: 2400, turnAccel: 3600,
  jumpHeight: 66, doubleJumpHeight: 50, airJumps: 1, gravity: 1500, fallMult: 1.65, jumpCut: 0.4, apexHang: 0.5, apexThreshold: 45,
  maxFall: 480, airAccel: 1250, airDecel: 450, coyote: 0.1, buffer: 0.12, cornerCorrect: 6,
  dashSpeed: 300, dashTime: 0.24, wallSlide: 95, wallJumpX: 150, wallJumpHeight: 60, wallLock: 0.1,
  camLerp: 9, lookahead: 40, hitstop: 1, shake: 1,
};
let P = Object.assign({}, DEFAULTS);
try { Object.assign(P, JSON.parse(localStorage.getItem('ec_params_v2') || '{}')); } catch (e) {}
function saveParams() { try { localStorage.setItem('ec_params_v2', JSON.stringify(P)); } catch (e) {} }

// =====================================================================
//  工具函数
// =====================================================================
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const approach = (v, target, delta) => v < target ? Math.min(v + delta, target) : Math.max(v - delta, target);
const sign = v => v > 0 ? 1 : v < 0 ? -1 : 0;
const rand = (a, b) => a + Math.random() * (b - a);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

// =====================================================================
//  第二关「坐标荒原」：函数曲线平台 + 渐近线激光 + Boss「函数怪 ƒ」
// =====================================================================
const curves = [];     // { x0, x1, f(x, t) → 世界 y, label, color, hazard }
const lasers = [];     // { x, y0, y1, period, phase }
let curveT = 0;        // 曲线时间（「函数·定格」开启时停止）
let funcOwned = false, funcOn = false, funcItem = null;
const addCurve = (x0, x1, f, label, color, hazard = false, ghost = false) => { const c = { x0, x1, f, label, color, hazard, ghost, hazardNow: false }; curves.push(c); return c; };
const curveSolid = c => !c.hazardNow && !(c.ghost && !funcOn);   // ghost：只是投影，定格后才是实体
function buildFunctionStage() {
  fill(0, 22, W, 4); fill(0, 0, 1, 22);
  checkpoints.push({ x: 3 * T, y: 22 * T });
  sign_(3, 15, '坐标荒原：这里的平台由函数实时绘制');
  sign_(13, 12, '曲线只能从上方站上去　↓ + 跳 穿过');
  fill(14, 19, 4, 3); fill(20, 17, 3, 5);
  spawns.push(['walker', 26, 21]);
  // ① 正弦桥
  fill(32, 22, 28, 4, '.');
  sign_(31, 14, '正弦桥：顺着波峰走');
  addCurve(31.5 * T, 60.5 * T, (x, t) => 21 * T - 20 * Math.sin((x - 31 * T) / 16 - 2.2 * t), 'y = 20·sin(x − 2.2t)', '#48f0d8');
  spawns.push(['flyer', 46, 13]);
  checkpoints.push({ x: 62 * T, y: 22 * T });
  // ② 斜率之门
  fill(66, 22, 30, 4, '.');
  sign_(63, 14, '一次函数 y = kx：斜率 k 一直在变');
  for (let i = 0; i < 3; i++) {
    const px = (70 + 10 * i) * T, py = (20 - 3 * i) * T, ph = i * 1.2;
    addCurve(px - 56, px + 56, (x, t) => py + (x - px) * 0.6 * Math.sin(1.3 * t + ph), `y = k${i + 1}·x`, '#ff6ad5');
  }
  fill(96, 13, 14, 9);
  spawns.push(['turret', 104, 12]);
  checkpoints.push({ x: 112 * T, y: 22 * T });
  // ③ 抛物线电梯
  fill(116, 22, 15, 4, '.');
  sign_(113, 11, '站上抛物线，趁它上升时起跳 + 二段跳');
  addCurve(116 * T, 131 * T, (x, t) => { const c = 20 * T + 40 * Math.sin(1.8 * t), d = x - 123.5 * T; return c + d * d / 180; }, 'y = (x − h)²/180 + c(t)', '#ffd166');
  fill(131, 14, 10, 8);
  spawns.push(['hopper', 136, 13]);
  checkpoints.push({ x: 143 * T, y: 22 * T });
  // ④ 取整阶梯
  fill(146, 22, 24, 4, '.');
  sign_(144, 13, '取整函数 ⌊x⌋：会自己移动的阶梯');
  addCurve(146 * T, 170 * T, (x, t) => 21 * T - 16 * (((Math.floor((x - 146 * T + 36 * t) / 32)) % 5 + 5) % 5), 'y = 16·(⌊(x + 36t)/32⌋ mod 5)', '#9b8cff');
  spawns.push(['flyer', 158, 11]);
  checkpoints.push({ x: 172 * T, y: 22 * T });
  // ⑤ 正切渐近线激光
  sign_(174, 14, 'x = π/2 + kπ：正切的渐近线，亮起时别碰');
  for (let k = 0; k < 4; k++) lasers.push({ x: (180 + 5 * k) * T + 8, y0: 0, y1: 22 * T, period: 2.4, phase: k * 0.55 });
  spawns.push(['walker', 199, 21]);
  checkpoints.push({ x: 204 * T, y: 22 * T });
  // ⑥ Boss 房：地板是函数怪的函数
  ROOM3 = { x0: 208, x1: 233, top: 7 };
  fill(208, 0, 2, 18); fill(232, 0, 2, 18); fill(210, 0, 22, 7);
  fill(210, 22, 22, 4, '.');                                    // 未定义区（深渊）
  // ⑦ 函数试炼
  checkpoints.push({ x: 236 * T, y: 22 * T });
  sign_(235, 13, 'Q 切换规则芯片「函数」：让曲线和激光定格');
  fill(240, 22, 20, 4, '.');
  addCurve(240 * T, 260 * T, (x, t) => 21 * T - 30 * Math.sin((x - 240 * T) / 10 - 9 * t), 'y = 30·sin(x − 9t)  高频电流：定格后才能踩', '#ff5a7a', true);
  checkpoints.push({ x: 262 * T, y: 22 * T });
  sign_(261, 12, '虚线只是投影：挑准时机定格，让斜坡变成通向高台的桥');
  fill(265, 22, 17, 4, '.');
  addCurve(264.5 * T, 282 * T, (x, t) => 22 * T - (x - 264.5 * T) * (0.25 + 0.3 * Math.sin(2.6 * t)), 'y = k(t)·x  投影：定格后才是实体', '#ff6ad5', false, true);
  fill(282, 13, 8, 9);
  fill(W - 2, 0, 2, 22);
  GOAL = { x: 292 * T, y: 9 * T, w: 2 * T, h: 4 * T };
  fill(290, 13, 6, 9);
}
function toggleFunc() {
  if (!funcOwned) return;
  funcOn = !funcOn;
  sfx(funcOn ? 'freeze' : 'thaw');
  const p = player;
  puff(p.x + p.w / 2, p.y + p.h / 2, 12, { color: funcOn ? '#ffd166' : '#9b8cff', smin: 30, smax: 100 });
  showMsg(funcOn ? '函数 · 定格' : '函数 · 解除定格', '', 0.9);
}
// 每步更新：危险曲线、激光
function updateCurves(dt) {
  if (!funcOn) curveT += dt;
  const p = player;
  if (p.dead) return;
  for (const c of curves) {
    c.hazardNow = c.hazard && !funcOn;
    if (!c.hazardNow || p.iframes > 0) continue;
    for (const fx of [p.x + 1, p.x + p.w / 2, p.x + p.w - 1]) {
      if (fx < c.x0 || fx > c.x1) continue;
      const cy = c.f(fx, curveT);
      if (cy > p.y - 2 && cy < p.y + p.h + 2) { hurtPlayer(3, fx - p.facing * 10); if (p.iframes > 0.9) p.vy = -300; break; }
    }
  }
  for (const L of lasers) {
    const ph = ((curveT + L.phase) % L.period) / L.period;
    L.on = ph < 0.42; L.warn = ph > 0.85;
    if (L.on && p.iframes <= 0 && p.x + p.w > L.x - 3 && p.x < L.x + 3 && p.y < L.y1 && p.y + p.h > L.y0) hurtPlayer(3, L.x);
  }
}
// 玩家与曲线的碰撞（在地形碰撞之后调用）
function playerCurves(p, dt, prevBottom, prevFx) {
  if (!curves.length || p.ceil) { p.curve = null; return; }
  const fx = p.x + p.w / 2, bottom = p.y + p.h;
  if (p.curve) {
    const c = p.curve;
    if (fx < c.x0 || fx > c.x1 || p.drop > 0 || !curveSolid(c)) p.curve = null;
    else {
      const cy = c.f(fx, curveT), dy = cy - bottom;
      if (dy > 8) p.curve = null;                             // 曲线突然下坠：脱离
      else if (dy < -18) { p.x -= p.vx * dt; p.vx = 0; }       // 前面是一道“墙”
      else {
        p.curveVy = (cy - c.f(fx, curveT - (funcOn ? 0 : dt))) / dt;
        p.y = cy - p.h; p.vy = 0; p.onGround = true;
      }
    }
  }
  if (!p.curve && p.vy >= 0 && p.drop <= 0) {
    for (const c of curves) {
      if (fx < c.x0 || fx > c.x1 || !curveSolid(c)) continue;
      const cyNow = c.f(fx, curveT), cyPrev = c.f(prevFx, curveT - (funcOn ? 0 : dt));
      if (prevBottom <= cyPrev + 2 && bottom >= cyNow - 0.5) {
        p.curve = c; p.y = cyNow - p.h; p.vy = 0; p.onGround = true; p.curveVy = 0;
        break;
      }
    }
  }
}
function drawCurves(cx) {
  for (const c of curves) {
    const a = Math.max(c.x0, cx - 4), b = Math.min(c.x1, cx + viewW + 4);
    if (a >= b) continue;
    const hz = c.hazardNow, ghost = c.ghost && !funcOn, col = hz ? (Math.floor(time * 20) % 2 ? '#ff5a7a' : '#ffd0da') : c.color;
    if (ghost) { ctx.setLineDash([4, 4]); ctx.lineDashOffset = -time * 20; }
    ctx.beginPath();
    for (let x = a; x <= b; x += 2) {
      let y = c.f(x, curveT);
      if (hz) y += (Math.random() - 0.5) * 2;
      if (x === a) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = col; ctx.globalAlpha = 0.25; ctx.lineWidth = 5; ctx.stroke();
    ctx.globalAlpha = ghost ? 0.6 : 1; ctx.lineWidth = 1.6; ctx.stroke(); ctx.globalAlpha = 1; ctx.setLineDash([]);
    if (funcOn) { ctx.strokeStyle = 'rgba(255,209,102,0.6)'; ctx.lineWidth = 0.6; ctx.stroke(); }
    if (c.label && c.x0 > cx - 200 && c.x0 < cx + viewW) {
      ctx.font = '6px ui-monospace,Menlo,Consolas,monospace'; ctx.fillStyle = c.color; ctx.globalAlpha = 0.75;
      ctx.fillText(c.label, c.x0 + 2, c.f(c.x0 + 2, curveT) + 12); ctx.globalAlpha = 1;
    }
  }
  for (const L of lasers) {
    if (L.x < cx - 10 || L.x > cx + viewW + 10) continue;
    if (L.on) {
      ctx.fillStyle = 'rgba(255,90,122,0.3)'; ctx.fillRect(L.x - 4, L.y0, 8, L.y1 - L.y0);
      ctx.fillStyle = Math.floor(time * 30) % 2 ? '#ffd0da' : '#ff5a7a'; ctx.fillRect(L.x - 1.5, L.y0, 3, L.y1 - L.y0);
    } else {
      ctx.fillStyle = L.warn && Math.floor(time * 16) % 2 ? 'rgba(255,90,122,0.6)' : 'rgba(255,90,122,0.15)';
      ctx.fillRect(L.x - 0.5, L.y0, 1, L.y1 - L.y0);
    }
  }
}

// ---- Boss 3：函数怪 ƒ ----
const FN = {
  flat:   { label: 'ƒ(x) = 0', f: () => 0 },
  sin:    { label: 'ƒ(x) = 28·sin(x/48 − 1.5t)', f: (u, t) => -28 * Math.sin(u / 48 - 1.5 * t) },
  lin:    { label: 'ƒ(x) = 0.3x', f: u => -0.3 * u },
  par:    { label: 'ƒ(x) = 48 − x²/600', f: u => -(48 - u * u / 600) },
  abs:    { label: 'ƒ(x) = |x| / 3', f: u => -Math.abs(u) / 3 },
  step:   { label: 'ƒ(x) = 16·⌊x/48⌋', f: u => -16 * Math.floor(u / 48) },
  sinabs: { label: 'ƒ(g(x)) = |30·sin(x/40 − 2t)|', f: (u, t) => -Math.abs(30 * Math.sin(u / 40 - 2 * t)) },
  sinlin: { label: 'ƒ(x) = 0.25x + 18·sin(x/30 − 2t)', f: (u, t) => -(0.25 * u + 18 * Math.sin(u / 30 - 2 * t)) },
};
const ATK = { sin: 'sinb', sinabs: 'sinb', lin: 'laser', sinlin: 'laser', par: 'lob', abs: 'dive', step: 'blocks', flat: 'sinb' };
let boss3 = null, b3Proj = [];
const B3 = () => ({ x0: (ROOM3.x0 + 2) * T, x1: ROOM3.x1 * T, cx: (ROOM3.x0 + 2 + ROOM3.x1) * T / 2, base: 20 * T });
function arenaY(x, t = curveT) {
  const b = boss3, r = B3(), u = x - r.cx;
  const k = b.morph >= 1 ? 1 : b.morph * b.morph * (3 - 2 * b.morph);
  const off = FN[b.prevFn].f(u, t) * (1 - k) + FN[b.fn].f(u, t) * k;
  return clamp(r.base + off, 9 * T, 22 * T - 2);
}
function resetBoss3() {
  boss3 = { state: funcOwned ? 'dead' : 'none', x: 0, y: 0, px: 0, py: 0, hp: BOSS_MAXHP, hpShown: 0, inv: 0, flash: 0, t: 0, timer: 0,
    fn: 'flat', prevFn: 'flat', morph: 1, next: null, preview: 0, fnTimer: 0, atkTimer: 0, phase: 1, face: -1, dive: null, pose: 0, poseT: 0, boomT: 0, sq: 1 };

}

        if (!overlapsSolid(b.x - i, b.y, b.w, b.h)) { b.x -= i; return null; }

  // ---- 水与冰 ----
  const wasWater = p.inWater;
  p.inWater = !iceMode && tileAt(Math.floor((p.x + p.w / 2) / T), Math.floor((p.y + p.h * 0.5) / T)) === '~';
  if (wasWater !== p.inWater && Math.abs(p.vy) > 30) splash(p.x + p.w / 2, p.y + p.h * 0.5);
  if (p.inWater) {
    p.bubT -= dt;
    if (p.bubT <= 0) { p.bubT = rand(0.2, 0.5); puff(p.x + p.w / 2 + p.facing * 4, p.y + 6, 1, { angle: -Math.PI / 2, spread: 0.3, smin: 10, smax: 30, color: '#cfe8ff', grav: -60, lmin: 0.5, lmax: 0.9, drag: 1, zmin: 1, zmax: 2.2 }); }
  }
  const footRow = Math.round((p.y + p.h) / T);
  const onIce = p.onGround && !p.ceil && iceMode && rowHas(footRow, p.x, p.w, '~') && !rowHas(footRow, p.x, p.w, '#');
  const wMul = p.inWater ? 0.72 : 1;
  const ix = ctrl ? (held('right') ? 1 : 0) - (held('left') ? 1 : 0) : 0;

  // ---- 贴墙检测（2px 容差） ----
  p.wallDir = 0;
  if (!p.onGround) {
    // 蹬墙判定放宽到 4px，离墙一点点也能蹬
    if (overlapsSolid(p.x - 4, p.y + 3, 4, p.h - 8)) p.wallDir = -1;
    else if (overlapsSolid(p.x + p.w, p.y + 3, 4, p.h - 8)) p.wallDir = 1;
  }
  const touchingWall = p.wallDir !== 0 && (overlapsSolid(p.x - 0.5, p.y + 3, 0.5, p.h - 8) || overlapsSolid(p.x + p.w, p.y + 3, 0.5, p.h - 8));

  // ---- 冲刺 ----
  if (ctrl && p.dashBuf > 0 && p.dashing <= 0 && (p.onGround || p.airDash > 0) && !(p.wallDir && !p.onGround)) {
    if (!p.onGround) p.airDash--;
    p.dashBuf = 0;
    p.dashDir = ix || p.facing;
    p.facing = p.dashDir;
    p.dashing = P.dashTime;
    p.vx = p.dashDir * P.dashSpeed * wMul;
    if (!p.onGround) p.vy = 0;
    p.sx = 1.35; p.sy = 0.75;
    sfx('dash');
    dust(p.x + p.w / 2 - p.dashDir * 6, p.y + p.h, 5, -p.dashDir);
  }

  // ---- 跳跃（缓冲 + 土狼时间） ----
  if (p.ceil && ctrl && held('down')) { p.ceil = false; p.onGround = false; p.vy = 60; sfx('magOff'); }
  if (ctrl && p.jumpBuf > 0) {
    if (p.ceil) {
      // 从磁性天花板上松开
      p.ceil = false; p.onGround = false; p.coyote = 0; p.jumpBuf = 0; p.vy = 90;
      p.sx = 0.8; p.sy = 1.2; sfx('magOff');
    } else if (held('down') && p.onGround && (onOneWayOnly(p) || p.curve)) {
      // 穿过单向平台 / 函数曲线
      p.jumpBuf = 0; p.drop = 0.18; p.y += 1; p.onGround = false; p.coyote = 0; p.curve = null;
    } else if (p.onGround || p.coyote > 0) {
      const dashJ = p.dashing > 0 || held('dash');
      p.vy = -jumpVel(P.jumpHeight) * (p.inWater ? 0.75 : 1);
      if (p.curve) { p.vy += Math.min(0, p.curveVy) * 0.9; p.curve = null; }   // 曲线上升时起跳：借力
      p.jumping = true; p.jumpT = 0; p.onGround = false; p.coyote = 0; p.jumpBuf = 0;
      if (dashJ) { p.dashJump = true; p.vx = (ix || p.facing) * Math.max(Math.abs(p.vx), P.dashSpeed); }
      p.dashing = 0;
      p.sx = 0.72; p.sy = 1.3;
      sfx('jump');
      dust(p.x + p.w / 2, p.y + p.h, 4);
    } else if (p.wallDir) {
      // 蹬墙跳
      const d = -p.wallDir;
      const dashJ = held('dash');
      p.vx = d * (dashJ ? P.dashSpeed : P.wallJumpX);
      p.vy = -jumpVel(P.wallJumpHeight) * (p.inWater ? 0.75 : 1);
      p.dashJump = dashJ; p.jumping = true; p.jumpT = 0; p.jumpBuf = 0; p.dashing = 0;
      p.wallLock = P.wallLock; p.facing = d; p.airDash = 1; p.airJumps = P.airJumps;
      p.sx = 0.75; p.sy = 1.25;
      sfx('wall');
      puff(p.wallDir > 0 ? p.x + p.w : p.x, p.y + p.h * 0.6, 6, { angle: d > 0 ? 0 : Math.PI, spread: 0.9, smin: 30, smax: 90, color: '#b0b6c0' });
    } else if (p.airJumps > 0) {
      // 二段跳：可以在空中改变方向，保留水平惯性
      p.airJumps--;
      p.vy = -jumpVel(P.doubleJumpHeight) * (p.inWater ? 0.75 : 1);
      if (ix && sign(p.vx) !== ix) p.vx = ix * P.runSpeed * 0.6;
      p.jumping = true; p.jumpT = 0; p.jumpBuf = 0; p.dashing = 0;
      p.sx = 0.8; p.sy = 1.25; p.spinT = 0.3;
      sfx('jump2');
      for (let k = 0; k < 10; k++) {
        const a = k / 10 * Math.PI * 2;
        particles.push({ x: p.x + p.w / 2, y: p.y + p.h, px: 0, py: 0, vx: Math.cos(a) * 70, vy: Math.sin(a) * 18, life: 0.25, max: 0.25, size: 1.8, color: '#9fe8ff', grav: 0, drag: 5 });
      }
    }
  }

  // ---- 水平运动：加速度 + 摩擦 + 惯性保留 ----
  if (p.dashing > 0) {
    p.dashing -= dt;
    p.vx = p.dashDir * P.dashSpeed * wMul;
    if (!p.onGround) p.vy = 0;
    if ((p.onGround && !held('dash')) || ix === -p.dashDir) p.dashing = 0;
    p.ghostT -= dt;
    if (p.ghostT <= 0) { p.ghostT = 0.03; ghosts.push({ x: p.x, y: p.y, life: 0.2, sx: p.sx, sy: p.sy, f: p.facing, fr: heroFrame(p) }); }
  } else {
    const maxSpd = (p.dashJump && !p.onGround ? P.dashSpeed : P.runSpeed) * wMul;
    const target = ix * maxSpd;
    let accel;
    if (!ctrl) accel = 250;
    else if (ix !== 0 && sign(p.vx) === ix && Math.abs(p.vx) > maxSpd) {
      accel = p.onGround ? P.groundDecel * 0.5 : P.airDecel;     // 超速时缓慢衰减 = 惯性
    } else if (p.onGround) {
      accel = ix === 0 ? P.groundDecel : (p.vx !== 0 && sign(p.vx) !== ix ? P.turnAccel : P.groundAccel);
    } else {
      accel = ix === 0 ? P.airDecel : (p.vx !== 0 && sign(p.vx) !== ix ? P.airAccel * 1.4 : P.airAccel);
    }
    if (p.wallLock > 0) accel *= 0.2;
    if (onIce && ctrl) accel *= ix === 0 ? 0.08 : 0.3;      // 冰面：起步慢、刹不住
    // 转身打滑扬尘
    if (p.onGround && ix !== 0 && sign(p.vx) === -ix && Math.abs(p.vx) > 90) {
      p.slideT -= dt;
      if (p.slideT <= 0) {
        p.slideT = 0.04;
        if (onIce) puff(p.x + p.w / 2, p.y + p.h, 2, { angle: ix > 0 ? -0.3 : Math.PI + 0.3, spread: 0.4, smin: 40, smax: 100, color: '#e8f7ff', zmin: 1, zmax: 2 });
        else dust(p.x + p.w / 2, p.y + p.h, 2, ix);
      }
    }
    p.vx = approach(p.vx, target, accel * dt);
    if (ctrl && ix !== 0 && p.wallLock <= 0) p.facing = ix;
  }

  // ---- 滑墙 ----
  p.wallSliding = !p.onGround && touchingWall && ix === p.wallDir && p.vy > 0 && p.dashing <= 0;
  if (p.wallSliding) {
    p.dashJump = false;
    p.airDash = 1; p.airJumps = P.airJumps;
    p.dustT -= dt;
    if (p.dustT <= 0) {
      p.dustT = 0.06;
      puff(p.wallDir > 0 ? p.x + p.w : p.x, p.y + 4, 1, { angle: -Math.PI / 2, spread: 0.4, smin: 10, smax: 40, color: '#c8ccd4', zmin: 1, zmax: 2.2 });
    }
  }

  // ---- 重力：上升/下落不对称 + 顶点滞空 + 松键截断 ----
  if (p.ceil) {

  } else if (!(p.dashing > 0 && !p.onGround)) {
    let g = P.gravity;
    if (p.vy > 0) g *= P.fallMult;
    if (p.inWater) g *= 0.4;
    if (!p.onGround && Math.abs(p.vy) < P.apexThreshold && held('jump')) g *= P.apexHang;
    p.vy += g * dt;
    p.jumpT += dt;
    // 松键截断（至少保持 0.05s，保证最小跳跃高度稳定）
    if (p.jumping && p.vy < 0 && !held('jump') && p.jumpT > 0.05) { p.vy *= P.jumpCut; p.jumping = false; }
    if (p.vy >= 0) p.jumping = false;
    if (p.wallSliding && p.vy > P.wallSlide) p.vy = approach(p.vy, P.wallSlide, 4000 * dt);
    if (p.inWater) { if (p.vy > 130) p.vy = approach(p.vy, 130, 2500 * dt); }
    else if (p.vy > P.maxFall) p.vy = P.maxFall;
  }

  // ---- 磁力吸附 ----
  if (magOn && !p.ceil && !p.onGround && p.dashing <= 0 && (p.vy < 40 || held('up')) && magneticNear(p, 34)) {
    p.vy -= 3000 * dt;                                            // 头顶附近的金属把人吸上去
    if (Math.random() < 0.3) puff(p.x + p.w / 2 + rand(-6, 6), p.y, 1, { angle: -Math.PI / 2, spread: 0.3, color: '#ff9c45', smin: 40, smax: 90, lmin: 0.1, lmax: 0.2, zmin: 1, zmax: 1.5 });
  }
  if (magOn && p.wallSliding && magneticWall(p)) p.vy = Math.min(p.vy, 1);   // 磁性墙：贴住不滑

  // ---- 移动与碰撞 ----
  const wasGround = p.onGround, fallVy = p.vy, prevBottom = p.y + p.h, prevFx = p.x + p.w / 2;
  if (moveX(p, p.vx * dt) && p.dashing > 0) p.dashing = 0;
  const hit = moveY(p, p.vy * dt, magOn && magneticNear(p, 16) ? 0 : P.cornerCorrect);   // 磁性天花板不做撞角修正，保证能吸住
  if (hit === 'ceil') {
    p.jumping = false;
    if (p.ceil) { /* 倒挂行走中，正常贴合 */ }
    else if (magOn && magneticAbove(p)) {
      p.ceil = true; p.vy = 0; p.dashJump = false; p.airDash = 1; p.airJumps = P.airJumps;
      p.sx = 1.3; p.sy = 0.7; sfx('clank'); addShake(0.08);
      puff(p.x + p.w / 2, p.y, 6, { angle: Math.PI / 2, spread: 1.2, color: '#ff9c45', smin: 30, smax: 90 });
    } else { sfx('bonk'); puff(p.x + p.w / 2, p.y, 3, { angle: Math.PI / 2, spread: 1, color: '#b0b6c0' }); }
  }
  if (hit === 'floor') p.vy = 0;
  if (p.ceil && (!magOn || !magneticAbove(p))) { p.ceil = false; p.vy = Math.max(p.vy, 0); }   // 走出金属范围就掉下来
  p.onGround = p.ceil ? true : p.vy >= 0 && grounded(p);
  playerCurves(p, dt, prevBottom, prevFx);
  if (p.onGround) {
    p.coyote = p.ceil ? 0 : P.coyote;
    p.airDash = 1; p.airJumps = P.airJumps;
    if (!wasGround) {
      // 落地：按冲击速度挤压
      const k = clamp(fallVy / 480, 0.15, 1);
      p.sx = 1 + 0.4 * k; p.sy = 1 - 0.32 * k;
      p.dashJump = false;
      if (fallVy > 150) { sfx('land'); dust(p.x + p.w / 2, p.y + p.h, Math.round(3 + 5 * k)); }
      if (fallVy > 420) addShake(0.12);
    }
    // 跑动扬尘
    if (Math.abs(p.vx) > 120 && !p.ceil) {
      p.dustT -= dt;
      if (p.dustT <= 0) { p.dustT = p.dashing > 0 ? 0.04 : 0.16; dust(p.x + p.w / 2 - sign(p.vx) * 5, p.y + p.h, 1, -sign(p.vx)); }
    }
  }

  // ---- 射击与蓄力 ----
  if (ctrl && p.shootBuf > 0) {
    p.shootBuf = 0;
    if (bullets.filter(b => b.lvl === 0).length < 4) fire(0);
    p.charging = true; p.charge = 0; p.chargeLvl = 0;
  }
  if (p.charging) {
    if (held('shoot') && ctrl) {
      p.charge += dt;
      const lvl = p.charge >= 1.1 ? 2 : p.charge >= 0.45 ? 1 : 0;
      if (lvl > p.chargeLvl) { p.chargeLvl = lvl; sfx('charged'); }
      if (p.charge > 0.3 && Math.random() < (lvl === 2 ? 0.7 : 0.35)) {
        const a = rand(0, Math.PI * 2), r = 18;
        const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
        particles.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, px: 0, py: 0, vx: -Math.cos(a) * 80, vy: -Math.sin(a) * 80,
          life: 0.2, max: 0.2, size: 1.6, color: lvl === 2 ? '#fff176' : '#81d4fa', grav: 0, drag: 0, follow: true });
      }
    } else {
      if (p.chargeLvl > 0 && ctrl) fire(p.chargeLvl);
      p.charging = false; p.charge = 0; p.chargeLvl = 0;
    }
  }

  // ---- 尖刺 ----
  {
    const x0 = Math.floor((p.x + 2) / T), x1 = Math.floor((p.x + p.w - 2) / T);
    const row = Math.floor((p.y + p.h - 1) / T);
    for (let i = x0; i <= x1; i++) if (tileAt(i, row) === '^' && p.y + p.h > row * T + 8) {
      hurtPlayer(3, p.x + p.w / 2 - (sign(p.vx) || p.facing) * 10);
      if (p.iframes > 0.9) p.vy = -330;
      break;
    }
  }

  // ---- 函数怪竞技场：掉进“未定义区” ----
  if (STAGE === 'function' && boss3 && boss3.state !== 'none' && boss3.state !== 'dead' && p.y > 22 * T + 10 && p.x > ROOM3.x0 * T && p.x < ROOM3.x1 * T) {
    p.hp -= 3; sfx('hurt'); addShake(0.4);
    if (p.hp <= 0) { killPlayer(); return; }
    p.x = B3().cx - p.w / 2; p.y = 9 * T; p.px = p.x; p.py = p.y; p.vx = 0; p.vy = 0; p.iframes = 1; p.curve = null;
    showMsg('ƒ(x) 在这里未定义', '', 1);
  }
  // ---- 掉坑 ----
  if (p.y > H * T + 40) {
    p.hp -= 4;
    sfx('hurt'); addShake(0.4);
    if (p.hp <= 0) { killPlayer(); return; }
    const c = checkpoints[checkpoint];
    p.x = c.x; p.y = c.y - p.h; p.px = p.x; p.py = p.y; p.vx = 0; p.vy = 0; p.iframes = 1;
    p.dashing = 0; p.dashJump = false;
  }

  // ---- 外观：挤压回弹 + 倾斜 ----
  const k = 1 - Math.exp(-dt * 16);
  p.sx = lerp(p.sx, 1, k); p.sy = lerp(p.sy, 1, k);
  const leanT = p.onGround ? (p.vx / P.dashSpeed) * 0.14 : (p.vx / P.dashSpeed) * 0.06;
  p.lean = lerp(p.lean, leanT, 1 - Math.exp(-dt * 12));

  else p.runPhase = 0;

  // ---- 存档点 / 终点 ----
  for (let i = checkpoint + 1; i < checkpoints.length; i++) {
    if (p.x > checkpoints[i].x) { checkpoint = i; sfx('check'); puff(checkpoints[i].x + 4, checkpoints[i].y - 30, 14, { color: '#81c784', smax: 100 }); }
  }
  if (!goalReached && overlap(p, GOAL)) { goalReached = true; goalTime = runTime; sfx('check'); addShake(0.3); }
}

function fire(lvl) {
  const p = player;
  const d = p.wallSliding ? -p.wallDir : p.facing;
  const spec = [
    { r: 3, spd: 430, dmg: 1, pierce: false, col: '#fff59d' },
    { r: 6, spd: 450, dmg: 2, pierce: false, col: '#81d4fa' },
    { r: 11, spd: 470, dmg: 4, pierce: true, col: '#fff176' },
  ][lvl];
  const x = p.x + p.w / 2 + d * 13, y = p.ceil ? p.y + 12.5 : p.y + p.h - 12.5;
  bullets.push({ x, y, px: x, py: y, vx: d * spec.spd + p.vx * 0.25, r: spec.r, dmg: spec.dmg, pierce: spec.pierce, col: spec.col, lvl, life: 1.2, hits: new Set() });
  p.shootPose = 0.28;
  puff(x, y, lvl ? 8 : 3, { angle: d > 0 ? 0 : Math.PI, spread: 0.6, smin: 40, smax: 140, color: spec.col, lmin: 0.08, lmax: 0.18, drag: 8 });
  if (lvl === 0) sfx('shoot');
  else if (lvl === 1) { sfx('shoot1'); addShake(0.08); }
  else { sfx('shoot2'); addShake(0.3); if (!p.dashing) p.vx -= d * 70; }
}

function hurtPlayer(dmg, srcX) {
  const p = player;
  if (p.iframes > 0 || p.dead) return;
  p.hp -= dmg;
  p.iframes = 1.0; p.hurt = 0.3; p.ceil = false; p.curve = null;
  p.dashing = 0; p.dashJump = false; p.charging = false; p.charge = 0; p.chargeLvl = 0;
  const dir = (p.x + p.w / 2) < srcX ? -1 : 1;
  p.vx = dir * 130; p.vy = -220; p.onGround = false;
  p.sx = 0.8; p.sy = 1.2;
  hitstop(0.09); addShake(0.45); sfx('hurt');
  puff(p.x + p.w / 2, p.y + p.h / 2, 10, { color: '#4fc3f7', smax: 120 });
  if (p.hp <= 0) killPlayer();
}
function killPlayer() {
  const p = player;
  p.dead = true; p.hp = 0; deathT = 1.2;
  hitstop(0.15); addShake(0.8);
  for (let i = 0; i < 2; i++) puff(p.x + p.w / 2, p.y + p.h / 2, 16, { color: i ? '#ffffff' : '#4fc3f7', smin: 60, smax: 200, lmin: 0.4, lmax: 0.9, drag: 2, zmin: 2, zmax: 4.5 });
}

// =====================================================================
//  敌人

function onScreen(x, y, w, h, m) {
  return x + w > cam.x - m && x < cam.x + viewW + m && y + h > cam.y - m && y < cam.y + VIEW_H + m;
}
function updateEnemy(e, dt) {

  }

  e.sq = lerp(e.sq, 1, 1 - Math.exp(-dt * 14));

  const pcx = p.x + p.w / 2, pcy = p.y + p.h / 2, ecx = e.x + e.w / 2, ecy = e.y + e.h / 2;
  const dx = pcx - ecx, dy = pcy - ecy, dist = Math.hypot(dx, dy);

  if (e.type === 'walker') {
    e.vx = approach(e.vx, e.dir * 42, 500 * dt);
    e.vy = Math.min(e.vy + 1500 * dt, 500);
    if (moveX(e, e.vx * dt)) e.dir *= -1;
    else if (e.onGround) {
      const ax = e.dir > 0 ? e.x + e.w + 1 : e.x - 1;
      const t = tileAt(Math.floor(ax / T), Math.floor((e.y + e.h + 2) / T));
      if (!isSolid(Math.floor(ax / T), Math.floor((e.y + e.h + 2) / T)) && t !== '-') e.dir *= -1;
    }
    if (moveY(e, e.vy * dt) === 'floor') e.vy = 0;
    e.onGround = grounded(e);
  } else if (e.type === 'hopper') {
    e.vy = Math.min(e.vy + 1500 * dt, 500);
    if (e.onGround) {
      e.vx = approach(e.vx, 0, 900 * dt);
      e.timer -= dt;
      if (e.timer < 0.25) e.sq = 0.7;   // 起跳前蓄力下蹲
      if (e.timer <= 0) {
        e.timer = 1.0 + Math.random() * 0.5;
        if (dist < 230) { e.vy = -400; e.vx = sign(dx) * 95; e.sq = 1.4; e.onGround = false; }
      }
    }
    if (moveX(e, e.vx * dt)) e.vx = 0;
    const was = e.onGround;
    if (moveY(e, e.vy * dt) === 'floor') e.vy = 0;

    const ty = (chase ? pcy - 22 : e.baseY) + Math.sin(e.t * 3) * 16;

// =====================================================================
//  规则：霜钟（水 ⇄ 冰）

function splash(x, y) {

function showMsg(title, sub, t) { msg = { title, sub, t }; }
function setIce(on) {

  if (on) {

    // 角色在水里时，把它推到冰面上；推不出去就拒绝冻结
    if (overlapsSolid(p.x, p.y, p.w, p.h)) {
      let ok = false;
      for (let d = 1; d <= 40; d++) if (!overlapsSolid(p.x, p.y - d, p.w, p.h)) { p.y -= d; p.py = p.y; p.vy = Math.min(p.vy, 0); ok = true; break; }
      if (!ok) { iceMode = false; return false; }
    }

  } else {

  }

}
function surfaceFx(color) {
  const x0 = Math.max(0, Math.floor(cam.x / T)), x1 = Math.min(W - 1, Math.floor((cam.x + viewW) / T));
  for (let j = 0; j < H; j++) for (let i = x0; i <= x1; i++)
    if (map[j][i] === '~' && tileAt(i, j - 1) !== '~') puff((i + 0.5) * T, j * T, 2, { angle: -Math.PI / 2, spread: 1.2, smin: 20, smax: 60, color, lmin: 0.3, lmax: 0.6, zmin: 1, zmax: 2 });
}
function toggleChip() {

    if (!setIce(true)) { sfx('deny'); showMsg('这里没有空间冻结', '先离开水道再开启规则', 1.4); return; }
    chipOn = true; sfx('freeze');
  } else {
    chipOn = false;
    if (bossFreezeT <= 0) { setIce(false); sfx('thaw'); }
  }
}

// =====================================================================
//  Boss：霜钟守卫
//  招式：跳砸（地面冰刺波）/ 钟鸣（冻结水池 + 冰片）/ 滑行冲撞 / 冰锥雨

function resetBoss() {

    hp: BOSS_MAXHP, hpShown: 0, inv: 0, t: 0, timer: 0, face: -1, last: '', phase: 1,
    sq: 1, shake: 0, ring: 9, flash: 0, landed: false, boomT: 0,

}
function startBoss() {
  const b = boss;
  b.state = 'intro'; b.timer = 2.2; b.landed = false; b.hpShown = 0;
  b.x = RX1 - 80; b.y = ROOM.top * T + 60; b.px = b.x; b.py = b.y;
  setDoor(ROOM.x0, true);

const bossBox = () => ({ x: boss.x - 20, y: boss.y - 46, w: 40, h: 46 });
const bossFighting = () => ['idle', 'hopPrep', 'hop', 'tollPrep', 'chargePrep', 'charge', 'rainPrep', 'rainHold'].includes(boss.state);

function updateBoss(dt) {

  }
  if (b.state === 'dead') return;
  b.t += dt; b.inv -= dt; b.flash -= dt; b.ring += dt;

      b.landed = true; b.sq = 0.65; b.ring = 0;
      addShake(0.5); sfx('slam'); sfx('bell');
      dust(b.x - 18, FLOOR_Y, 6); dust(b.x + 18, FLOOR_Y, 6);
    }
    if (b.landed) {
      const before = Math.floor(b.hpShown);
      b.hpShown = Math.min(BOSS_MAXHP, b.hpShown + dt * 26);

    }
    if (b.landed && b.hpShown >= BOSS_MAXHP && b.timer <= 0) { b.state = 'idle'; b.timer = 0.5; }
    return;
  }

    b.timer -= dt; b.boomT -= dt; b.shake = 1;

      flashT = 0.35; addShake(1); hitstop(0.12);
      for (let i = 0; i < 3; i++) puff(b.x, b.y - 24, 20, { color: ['#ffffff', '#81d4fa', '#e1f5fe'][i], smin: 80, smax: 320, lmin: 0.4, lmax: 1.0, drag: 2, zmin: 2, zmax: 5 });

}
function startCharge(t) {

}
function pickAttack() {
  const opts = ['hop', 'toll', 'charge', 'rain'].filter(a => a !== boss.last);
  const a = opts[Math.floor(Math.random() * opts.length)];
  boss.last = a;
  if (a === 'hop') { boss.state = 'hopPrep'; boss.timer = 0.35; }
  else if (a === 'toll') { boss.state = 'tollPrep'; boss.timer = 0.6; }
  else if (a === 'charge') startCharge(0.65);

}

  const n = b.phase === 2 ? 7 : 5;
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (i - (n - 1) / 2) * 0.34;
    const x = b.x, y = b.y - 40;
    bossProj.push({ kind: 'shard', x, y, px: x, py: y, vx: Math.cos(a) * 230, vy: Math.sin(a) * 300 - 60, dmg: 2, life: 4 });

    if (xs.every(v => Math.abs(v - x) > 30)) xs.push(x);
  }
  xs.forEach((x, i) => {
    const y = ROOM.top * T;

}
function damageBoss(dmg, dir) {

  hitstop(dmg >= 4 ? 0.06 : 0.03); sfx('hit'); addShake(dmg >= 4 ? 0.22 : 0.06);
  puff(b.x - dir * 20, b.y - 24, 6, { angle: dir > 0 ? Math.PI : 0, spread: 0.9, color: '#fff59d', smin: 40, smax: 160, lmin: 0.1, lmax: 0.25 });

function bossProjBox(q) {

  if (q.kind === 'shard') return { x: q.x - 3.5, y: q.y - 3.5, w: 7, h: 7 };

    } else if (q.kind === 'shard') {

function updateChipItem(dt) {

function drawBoss(a) {
  const b = boss;
  if (b.state === 'none' || b.state === 'dead') return;
  const x = lerp(b.px, b.x, a) + (b.shake ? rand(-1, 1) * b.shake * 1.5 : 0), y = lerp(b.py, b.y, a);
  // 钟声冲击环
  if (b.ring < 0.7) {
    ctx.strokeStyle = `rgba(179,229,252,${1 - b.ring / 0.7})`;
    ctx.lineWidth = 3 * (1 - b.ring / 0.7) + 0.5;
    ctx.beginPath(); ctx.arc(x, y - 28, 20 + b.ring * 420, 0, Math.PI * 2); ctx.stroke();
  }
  // 入场时吊着的铁链
  if (b.state === 'intro' && !b.landed) {
    ctx.fillStyle = '#5d6373';
    for (let cy2 = ROOM.top * T; cy2 < y - 56; cy2 += 6) ctx.fillRect(x - 1.5, cy2, 3, 4);
  }
  // 地面阴影（跳起时变小）
  const hgt = clamp((FLOOR_Y - y) / 120, 0, 1);
  ctx.fillStyle = `rgba(0,0,0,${0.3 * (1 - hgt * 0.6)})`;
  ctx.beginPath(); ctx.ellipse(x, FLOOR_Y, 24 * (1 - hgt * 0.4), 3, 0, 0, Math.PI * 2); ctx.fill();

  const white = b.flash > 0 || (b.state === 'dying' && Math.floor(time * 20) % 2);
  const P2 = b.phase === 2;
  const bs = SPR.bell, cs = SPR.clapper;
  if (!bs || !cs) return;
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  ctx.scale(1 / Math.sqrt(b.sq), b.sq);
  if (b.state === 'chargePrep') ctx.rotate(-b.face * 0.12);
  if (b.state === 'charge') ctx.rotate(b.face * 0.1);
  // 钟锤（画在钟身后面，只露出钟口下的锤头）
  const sw = b.state === 'charge' ? -b.face * 0.6 : Math.sin(b.t * 4) * 0.35;
  ctx.save(); ctx.translate(0, -24); ctx.rotate(sw);
  ctx.drawImage(white ? cs.white : cs.normal, -5, 0);
  ctx.restore();
  ctx.drawImage(white ? bs.white : bs.normal, P2 ? 56 : 0, 0, 56, 56, -28, -54, 56, 56);
  // 护目镜里的眼睛（看向玩家）

    ctx.fillRect(ex, -28, 10, 3);

  }
  ctx.restore();
}
function drawBossProj(a) {
  for (const q of bossProj) {

      ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 2.5, y - 11, 1.5, 8);

function drawChipItem() {

function updateBullets(dt) {

    b.x += b.vx * dt; b.y += (b.vy || 0) * dt; b.life -= dt;
    if (b.deflected) { b.vy += 900 * dt; continue; }
    if (isSolid(Math.floor(b.x / T), Math.floor(b.y / T))) {
      b.life = 0;
      puff(b.x, b.y, 4, { color: b.col, smin: 30, smax: 100, lmin: 0.08, lmax: 0.18 });
      continue;
    }
    for (const e of enemies) {
      if (!e.alive || b.hits.has(e)) continue;
      if (b.x + b.r > e.x && b.x - b.r < e.x + e.w && b.y + b.r > e.y && b.y - b.r < e.y + e.h) {
        b.hits.add(e);
        damageEnemy(e, b.dmg, sign(b.vx));
        if (!b.pierce) { b.life = 0; break; }
      }
    }
    if (b.life > 0 && STAGE === 'function' && boss3Fighting() && !b.hits.has(boss3)) {
      if (Math.abs(b.x - boss3.x) < 14 + b.r && b.y + b.r > boss3.y - 26 && b.y - b.r < boss3.y + 24) {
        if (boss3.inv > 0) { b.deflected = true; b.vx = -b.vx * 0.5; b.vy = -240; b.life = 0.4; sfx('ding'); }
        else { b.hits.add(boss3); damageBoss3(b.dmg, sign(b.vx)); if (!b.pierce) b.life = 0; }
      }
    }
    if (b.life > 0 && boss2Fighting() && !b.hits.has(boss2)) {
      const bb = box2(boss2);
      if (b.x + b.r > bb.x && b.x - b.r < bb.x + bb.w && b.y + b.r > bb.y && b.y - b.r < bb.y + bb.h) {
        if (boss2.inv > 0) { b.deflected = true; b.vx = -b.vx * 0.5; b.vy = -240; b.life = 0.4; sfx('ding'); }
        else { b.hits.add(boss2); damageBoss2(b.dmg, sign(b.vx)); if (!b.pierce) b.life = 0; }
      }
    }
    if (b.life > 0 && bossVulnerableState() && !b.hits.has(boss)) {
      const bb = bossBox();
      if (b.x + b.r > bb.x && b.x - b.r < bb.x + bb.w && b.y + b.r > bb.y && b.y - b.r < bb.y + bb.h) {
        if (boss.inv > 0) {
          // 无敌时间内子弹被弹开（经典的“叮”）
          b.deflected = true; b.vx = -b.vx * 0.5; b.vy = -240; b.life = 0.4; sfx('ding');
        } else {
          b.hits.add(boss);
          damageBoss(b.dmg, sign(b.vx));
          if (!b.pierce) b.life = 0;
        }
      }
    }
    if (b.x < cam.x - 40 || b.x > cam.x + viewW + 40) b.life = 0;
  }
  bullets = bullets.filter(b => b.life > 0);

  const p = player;
  for (const b of ebullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (isSolid(Math.floor(b.x / T), Math.floor(b.y / T))) { b.life = 0; puff(b.x, b.y, 3, { color: '#ff8a80' }); continue; }
    if (!p.dead && b.x + b.r > p.x && b.x - b.r < p.x + p.w && b.y + b.r > p.y && b.y - b.r < p.y + p.h && p.iframes <= 0) {

}
function updateParticles(dt) {
  const p = player;
  for (const q of particles) {

    if (q.follow) { q.x += p.x - p.px; q.y += p.y - p.py; }

    q.vx *= d; q.vy *= d;

  if (pressed.shoot) p.shootBuf = 0.1;

  p.px = p.x; p.py = p.y; cam.px = cam.x; cam.py = cam.y;
  for (const e of enemies) { e.px = e.x; e.py = e.y; }

  boss2.px = boss2.x; boss2.py = boss2.y;
  boss3.px = boss3.x; boss3.py = boss3.y;

    f.y += (STAGE === 'function' ? -0.6 : 1) * (10 + 16 * f.z) * rdt - dy * f.z * 0.5;   // 第二关：向上飘的数据点
    f.x += Math.sin(time * 1.2 + f.ph) * 8 * f.z * rdt - dx * f.z * 0.5;
    f.x = ((f.x % viewW) + viewW) % viewW; f.y = ((f.y % VIEW_H) + VIEW_H) % VIEW_H;
    ctx.globalAlpha = 0.25 + 0.55 * f.z;
    const s = f.z > 0.85 ? 2 : 1;
    ctx.fillRect(Math.round(cx + f.x), Math.round(cy + f.y), s, s);
  }
  ctx.globalAlpha = 1;
}

function iceShown(i, j) {
  if (!iceMode) return false;
  if (!freezeWave) return true;
  const r = (time - freezeWave.t0) * 900;
  return Math.hypot((i + 0.5) * T - freezeWave.x, (j + 0.5) * T - freezeWave.y) < r;
}
// 水画在角色之后，角色看起来“泡在水里”
function drawWater(cx, cy) {
  const x0 = Math.max(0, Math.floor(cx / T)), x1 = Math.min(W - 1, Math.floor((cx + viewW) / T));
  const y0 = Math.max(0, Math.floor(cy / T)), y1 = Math.min(H - 1, Math.floor((cy + VIEW_H) / T));
  for (let j = y0; j <= y1; j++) for (let i = x0; i <= x1; i++) {
    if (map[j][i] !== '~' || iceShown(i, j)) continue;
    const surf = tileAt(i, j - 1) !== '~';
    const off = surf ? Math.round(1 + Math.sin(time * 3 + i * 0.9)) : 0;
    ctx.fillStyle = 'rgba(58,143,214,0.5)';
    ctx.fillRect(i * T, j * T + off, T, T - off);
    if (surf) { ctx.fillStyle = 'rgba(214,240,255,0.85)'; ctx.fillRect(i * T, j * T + off, T, 1); }
    ctx.fillStyle = `rgba(197,140,255,${0.35 + 0.2 * Math.sin(time * 3)})`;   // 规则光：能被芯片改写
    if (tileAt(i - 1, j) !== '~') ctx.fillRect(i * T, j * T + off, 1, T - off);
    if (tileAt(i + 1, j) !== '~') ctx.fillRect(i * T + T - 1, j * T + off, 1, T - off);
  }
}

const heroImg = new Image();
let heroTints = null;
heroImg.onload = () => {
  const mk = col => {
    const c = document.createElement('canvas'); c.width = heroImg.width; c.height = heroImg.height;
    const g = c.getContext('2d'); g.drawImage(heroImg, 0, 0);
    if (col) { g.globalCompositeOperation = 'source-atop'; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height); }
    return c;
  };
  heroTints = { normal: mk(null), white: mk('rgba(255,255,255,0.92)'), cyan: mk('rgba(190,240,255,0.55)'), yellow: mk('rgba(255,240,140,0.7)'), ghost: mk('rgba(79,195,247,1)') };
};
heroImg.src = HERO_SRC;
// 帧：0 站立 1 呼吸 2-7 跑步循环 8 上升 9 下落 10 冲刺 11 滑墙 12 受伤
function heroFrame(p) {
  if (p.hurt > 0) return 12;
  if (p.wallSliding) return 11;
  if (p.dashing > 0) return 10;
  if (!p.onGround) return p.vy < 0 ? 8 : 9;
  if (Math.abs(p.vx) > 20) return 2 + (Math.floor(p.runPhase) % 6);
  return Math.floor(time * 1.6) % 2 ? 1 : 0;
}
function drawHeroSprite(tint, fr, x, y, face, sx, sy, rot, centered = false) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sx * face, sy);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(tint, fr * 32, 0, 32, 32, -14, centered ? -17 : -31, 32, 32);   // 锚点：脚底中心（空翻时绕身体中心旋转）
  ctx.restore();
}
function drawPlayer(a) {
  const p = player;
  if (p.dead || !heroTints) return;
  for (const g of ghosts) {
    ctx.globalAlpha = (g.life / 0.2) * 0.4;
    drawHeroSprite(heroTints.ghost, g.fr, g.x + p.w / 2, g.y + p.h, g.f, g.sx, g.sy, 0);
  }
  ctx.globalAlpha = 1;
  if (p.iframes > 0 && p.hurt <= 0 && Math.floor(p.iframes * 24) % 2 === 0) return;
  const x = lerp(p.px, p.x, a) + p.w / 2, y = lerp(p.py, p.y, a) + p.h;
  const face = p.wallSliding ? -p.wallDir : p.facing;
  let tint = heroTints.normal;
  if (p.chargeLvl > 0 && Math.floor(time * (p.chargeLvl === 2 ? 30 : 18)) % 2) tint = p.chargeLvl === 2 ? heroTints.yellow : heroTints.cyan;
  if (p.hurt > 0 && Math.floor(time * 30) % 2) tint = heroTints.white;
  if (p.ceil) drawHeroSprite(tint, heroFrame(p), x, lerp(p.py, p.y, a), face, p.sx, -p.sy, -p.lean);
  else if (p.spinT > 0) drawHeroSprite(tint, 8, x, y - p.h / 2 + 1, face, p.sx, p.sy, p.lean + (1 - p.spinT / 0.3) * Math.PI * 2 * face, true);
  else drawHeroSprite(tint, heroFrame(p), x, y, face, p.sx, p.sy, p.lean);
}

const SPR = {};
function tintCanvas(img, col) {
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  if (col) { g.globalCompositeOperation = 'source-atop'; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height); }
  return c;
}

    let fr = 0, face = 1, by = Math.round(y + e.h);
    if (e.type === 'walker') { fr = Math.floor(e.t * 8) % 2; face = e.dir; }
    else if (e.type === 'hopper') { fr = e.onGround ? 0 : 1; face = sign(player.x - e.x) || 1; }
    else { fr = Math.floor(e.t * 14) % 2; by = Math.round(y + e.h / 2 + fh / 2 - 2); face = sign(player.x - e.x) || 1; }
    ctx.save(); ctx.translate(cx, by); ctx.scale(face / Math.sqrt(e.sq), e.sq);
    ctx.drawImage(img, fr * fw, 0, fw, fh, -fw / 2, -fh, fw, fh);
    ctx.restore();
  }
}

function drawBullets(a) {
  for (const b of bullets) {
    const x = lerp(b.px, b.x, a), y = lerp(b.py, b.y, a);
    if (b.lvl > 0) {
      ctx.globalAlpha = 0.35; ctx.fillStyle = b.col;
      ctx.beginPath(); ctx.ellipse(x - sign(b.vx) * b.r, y, b.r * 1.8, b.r * 0.8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = b.col;
    ctx.beginPath(); ctx.arc(x, y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(x, y, b.r * 0.5, 0, Math.PI * 2); ctx.fill();
  }
  for (const b of ebullets) {
    const x = lerp(b.px, b.x, a), y = lerp(b.py, b.y, a);
    ctx.fillStyle = Math.floor(time * 16) % 2 ? '#ff8a80' : '#ffcdd2';
    ctx.beginPath(); ctx.arc(x, y, b.r, 0, Math.PI * 2); ctx.fill();
  }
}

function drawParticles() {
  for (const q of particles) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    ctx.fillStyle = q.color;
    const s = q.size * (0.4 + 0.6 * q.life / q.max);
    ctx.fillRect(q.x - s / 2, q.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
}

function drawWorldDecor() {
  ctx.font = '7px system-ui,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left';
  for (const s of signs) {
    if (s.x > cam.x + viewW || s.x + 160 < cam.x) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    const w = ctx.measureText(s.text).width + 8;
    ctx.fillRect(s.x - 4, s.y - 9, w, 13);
    ctx.fillStyle = '#c9ced8';
    ctx.fillText(s.text, s.x, s.y);
  }
  checkpoints.forEach((c, i) => {
    if (i === 0) return;
    ctx.fillStyle = '#6b7080'; ctx.fillRect(c.x, c.y - 32, 2, 32);
    ctx.fillStyle = i <= checkpoint ? '#81c784' : '#7a7f8c';
    const wv = Math.sin(time * 6 + i) * 1.5;
    ctx.beginPath(); ctx.moveTo(c.x + 2, c.y - 32); ctx.lineTo(c.x + 14, c.y - 28 + wv); ctx.lineTo(c.x + 2, c.y - 23); ctx.fill();
  });
  // 终点门
  ctx.fillStyle = goalReached ? '#81c784' : '#4a4f5c';
  ctx.fillRect(GOAL.x, GOAL.y, 3, GOAL.h); ctx.fillRect(GOAL.x + GOAL.w - 3, GOAL.y, 3, GOAL.h); ctx.fillRect(GOAL.x, GOAL.y, GOAL.w, 3);
  ctx.globalAlpha = 0.15 + 0.1 * Math.sin(time * 4);
  ctx.fillStyle = '#81c784'; ctx.fillRect(GOAL.x + 3, GOAL.y + 3, GOAL.w - 6, GOAL.h - 3);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#c9ced8'; ctx.textAlign = 'center'; ctx.fillText('GOAL', GOAL.x + GOAL.w / 2, GOAL.y - 4);
  ctx.textAlign = 'left';
}

function drawHUD(fps) {
  const u = scale;   // HUD 与世界同比例缩放
  ctx.setTransform(u, 0, 0, u, 0, 0);
  const p = player;
  // 血条
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(8, 8, 10, MAXHP * 4 + 4);
  for (let i = 0; i < MAXHP; i++) {
    ctx.fillStyle = i < p.hp ? (p.hp <= 4 ? '#ff8a65' : '#fff59d') : '#3a3d46';
    ctx.fillRect(10, 10 + (MAXHP - 1 - i) * 4, 6, 3);
  }
  // Boss 血条
  const hb = boss.state !== 'none' && boss.state !== 'dead' ? boss : boss2.state !== 'none' && boss2.state !== 'dead' ? boss2 : boss3.state !== 'none' && boss3.state !== 'dead' ? boss3 : null;
  if (hb) {
    const hp = hb.state === 'intro' ? Math.floor(hb.hpShown) : hb.hp;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(22, 8, 10, BOSS_MAXHP * 2.3 + 4);
    for (let i = 0; i < BOSS_MAXHP; i++) {
      ctx.fillStyle = i < hp ? (hb === boss ? '#81d4fa' : hb === boss3 ? '#ff7ad0' : '#ff9c45') : '#3a3d46';
      ctx.fillRect(24, 10 + (BOSS_MAXHP - 1 - i) * 2.3, 6, 1.6);
    }
  }
  // 芯片插槽
  const sy0 = 16 + MAXHP * 4;
  ctx.font = '7px system-ui,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  for (let k = 0; k < 2; k++) {
    const sx0 = 8, syk = sy0 + k * 14;
    const has = STAGE === 'function' ? (k === 0 && funcOwned) : (k === 0 ? chipOwned : magOwned), on = STAGE === 'function' ? funcOn : (k === 0 ? chipOn : magOn);
    ctx.fillStyle = has ? (on ? (STAGE === 'function' ? '#ffd166' : k === 0 ? '#81d4fa' : '#ffb070') : '#37474f') : 'rgba(0,0,0,0.4)';
    ctx.fillRect(sx0, syk, 11, 11);
    ctx.strokeStyle = has && on ? '#ffffff' : '#4a4f5c'; ctx.lineWidth = 0.6; ctx.strokeRect(sx0, syk, 11, 11);
    ctx.fillStyle = has ? (on ? '#1a1020' : '#90a4ae') : '#4a4f5c';
    ctx.fillText(has ? (STAGE === 'function' ? '函' : k === 0 ? '霜' : '磁') : '·', sx0 + 5.5, syk + 8.5);
  }
  if (chipOn && magOn) {                                   // 双芯片组合提示
    ctx.fillStyle = `rgba(197,140,255,${0.6 + 0.3 * Math.sin(time * 4)})`;
    ctx.fillText('磁冰', 13.5, sy0 + 36);
  }
  ctx.textAlign = 'left';
  // 信息
  ctx.font = '7px ui-monospace,Menlo,Consolas,monospace';
  ctx.textAlign = 'right';
  ctx.fillStyle = '#c9ced8';
  const vw = viewW;
  ctx.fillText(`TIME ${runTime.toFixed(2)}`, vw - 8, 14);
  ctx.fillStyle = '#7a8090';
  ctx.fillText(`速度 ${Math.abs(p.vx).toFixed(0).padStart(3)}  ${fps}fps`, vw - 8, 24);
  const st = p.dead ? '' : p.dashing > 0 ? '冲刺' : p.wallSliding ? '滑墙' : p.dashJump ? '冲刺跳' : !p.onGround ? '空中' : Math.abs(p.vx) > 5 ? '奔跑' : '站立';
  ctx.fillText(st, vw - 8, 33);
  ctx.textAlign = 'left';
  if (showHint) {
    ctx.fillStyle = 'rgba(200,205,215,0.55)';
    ctx.fillText('Tab 调参  Q/E 芯片  1~0 传送  R 存档  T 重来  M 静音  N 音乐  H 隐藏', 24, VIEW_H - 8);
  }
  if (goalReached) {
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(vw / 2 - 90, 34, 180, 34);
    ctx.fillStyle = '#81c784'; ctx.font = 'bold 11px system-ui,"PingFang SC",sans-serif';
    ctx.fillText('原型关卡完成！', vw / 2, 49);
    ctx.fillStyle = '#c9ced8'; ctx.font = '7px system-ui,"PingFang SC",sans-serif';
    ctx.fillText(`用时 ${goalTime.toFixed(2)} 秒　按 T 再挑战`, vw / 2, 61);
    ctx.textAlign = 'left';
  }
  // 函数怪：屏幕上方显示当前地板函数
  if (STAGE === 'function' && boss3 && (boss3Fighting() || boss3.state === 'intro')) {
    ctx.textAlign = 'center'; ctx.font = 'bold 8px ui-monospace,Menlo,Consolas,monospace';
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(vw / 2 - 90, 40, 180, boss3.next ? 26 : 14);
    ctx.fillStyle = '#48f0d8'; ctx.fillText(FN[boss3.fn].label, vw / 2, 50);
    if (boss3.next && Math.floor(time * 8) % 2) { ctx.fillStyle = '#ffd166'; ctx.fillText('重定义 → ' + FN[boss3.next].label, vw / 2, 62); }
    ctx.textAlign = 'left';
  }
  if (msg) {
    ctx.textAlign = 'center';
    ctx.globalAlpha = clamp(msg.t * 3, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(vw / 2 - 110, 8, 220, msg.sub ? 34 : 22);
    ctx.fillStyle = '#e1f5fe'; ctx.font = 'bold 11px system-ui,"PingFang SC",sans-serif';
    ctx.fillText(msg.title, vw / 2, 23);
    if (msg.sub) { ctx.fillStyle = '#b0bec5'; ctx.font = '7px system-ui,"PingFang SC",sans-serif'; ctx.fillText(msg.sub, vw / 2, 35); }
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }
  if (flashT > 0) { ctx.fillStyle = `rgba(255,255,255,${clamp(flashT * 2.5, 0, 0.9)})`; ctx.fillRect(0, 0, vw, VIEW_H); }
  if (p.dead) {
    ctx.fillStyle = `rgba(0,0,0,${clamp(1 - deathT, 0, 0.6)})`;
    ctx.fillRect(0, 0, vw, VIEW_H);
  }
}

let fpsAcc = 0, fpsN = 0, fpsShow = 60;
function render(a, rdt) {
  time += rdt;
  fpsAcc += rdt; fpsN++;
  if (fpsAcc > 0.5) { fpsShow = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  shakeT = Math.max(0, shakeT - rdt * 2.2);
  flashT = Math.max(0, flashT - rdt);
  musicDirector();
  if (msg) { msg.t -= rdt; if (msg.t <= 0) msg = null; }
  const s2 = shakeT * shakeT;
  const sx = (Math.random() * 2 - 1) * s2 * 7, sy = (Math.random() * 2 - 1) * s2 * 7;
  let cx = lerp(cam.px, cam.x, a) + sx, cy = lerp(cam.py, cam.y, a) + sy;
  // 对齐到物理像素，避免图块边缘闪烁
  cx = Math.round(cx * scale) / scale; cy = Math.round(cy * scale) / scale;

  ctx.setTransform(scale, 0, 0, scale, -cx * scale, -cy * scale);
  ctx.imageSmoothingEnabled = false;
  drawBackground(cx, cy);
  drawWorldDecor();
  drawTiles(cx, cy);
  drawCurves(cx);
  drawEnemies(a);
  drawBoss(a);
  drawBoss2(a);
  drawChipItem();
  drawMagItem();
  drawBoss3(a);
  drawFuncItem();
  drawPlayer(a);
  drawBullets(a);
  drawBossProj(a);
  drawB2Proj(a);
  drawB3Proj(a);
  drawWater(cx, cy);
  drawParticles();
  drawSnow(cx, cy, rdt);
  drawHUD(fpsShow);
}

// =====================================================================
//  主循环：固定步长 + 插值渲染
// =====================================================================
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  pollGamepad();
  acc += dt;
  while (acc >= STEP) {
    step(STEP);
    acc -= STEP;
    for (const a of ACTIONS) pressed[a] = false;
  }
  render(acc / STEP, dt);
  requestAnimationFrame(frame);
}

// =====================================================================
//  调参面板
// =====================================================================
const panel = document.getElementById('panel');
const fmt = v => (Math.abs(v) < 10 && v % 1 !== 0) ? (+v).toFixed(2) : String(Math.round(v * 100) / 100);
function buildPanel() {
  let html = '<h3>手感调参<small>Tab 关闭 · 实时生效</small></h3>';
  for (const d of PARAM_DEFS) {
    if (d[0] === 'g') { html += `<div class="grp">${d[1]}</div>`; continue; }
    const [k, label, min, max, st] = d;
    html += `<label><span>${label}</span><input type="range" data-k="${k}" min="${min}" max="${max}" step="${st}" value="${P[k]}"><b id="v_${k}">${fmt(P[k])}</b></label>`;
  }
  html += '<div class="btns"><button id="bReset">恢复默认</button><button id="bCopy">复制参数 JSON</button></div>';
  panel.innerHTML = html;
  panel.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => {
    const k = inp.dataset.k;
    P[k] = parseFloat(inp.value);
    document.getElementById('v_' + k).textContent = fmt(P[k]);
    saveParams();
  }));
  document.getElementById('bReset').onclick = () => { P = Object.assign({}, DEFAULTS); saveParams(); buildPanel(); };
  document.getElementById('bCopy').onclick = e => {
    const txt = JSON.stringify(P, null, 2);
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(
      () => { e.target.textContent = '已复制 ✓'; },
      () => {
        let ta = document.getElementById('pjson');
        if (!ta) { ta = document.createElement('textarea'); ta.id = 'pjson'; ta.style.cssText = 'width:100%;height:120px;margin-top:8px;background:#111;color:#8fd3ff;border:1px solid #444;font-size:11px'; panel.appendChild(ta); }
        ta.value = txt; ta.select();
      });
    setTimeout(() => { e.target.textContent = '复制参数 JSON'; }, 1500);
  };
}
function togglePanel() {
  const show = panel.style.display !== 'block';
  panel.style.display = show ? 'block' : 'none';
  if (show) buildPanel();
  else if (document.activeElement) document.activeElement.blur();
}

// =====================================================================
//  开始界面 / 触屏
// =====================================================================
const startEl = document.getElementById('start');
function hideStart() {
  initAudio();
  if (startEl.style.display !== 'none') startEl.style.display = 'none';
}
startEl.addEventListener('pointerdown', hideStart);
document.querySelectorAll('#start .stages button').forEach(btn => {
  if (btn.dataset.s === STAGE) btn.classList.add('cur');
  btn.addEventListener('pointerdown', e => {
    e.stopPropagation();
    if (btn.dataset.s === STAGE) { hideStart(); return; }
    location.hash = btn.dataset.s; location.reload();
  });
});

const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (isTouch) {
  document.getElementById('touch').style.display = 'block';
  const pad = document.getElementById('pad'), knob = document.getElementById('knob');
  let padId = null;
  const padUpdate = e => {
    const r = pad.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const m = Math.min(1, 50 / (Math.hypot(dx, dy) || 1));
    knob.style.transform = `translate(${dx * m}px,${dy * m}px)`;
    setSrc(tc, 'left', dx < -18); setSrc(tc, 'right', dx > 18);
    setSrc(tc, 'down', dy > 32); setSrc(tc, 'up', dy < -32);
  };
  const padEnd = () => {
    padId = null; knob.style.transform = '';
    for (const a of ['left', 'right', 'up', 'down']) setSrc(tc, a, false);
  };
  pad.addEventListener('pointerdown', e => { hideStart(); padId = e.pointerId; pad.setPointerCapture(e.pointerId); padUpdate(e); });
  pad.addEventListener('pointermove', e => { if (e.pointerId === padId) padUpdate(e); });
  pad.addEventListener('pointerup', padEnd); pad.addEventListener('pointercancel', padEnd);
  document.querySelectorAll('#tbtns .tb').forEach(btn => {
    const a = btn.dataset.a;
    const on = e => { e.preventDefault(); hideStart(); btn.setPointerCapture(e.pointerId); btn.classList.add('on'); setSrc(tc, a, true); };
    const off = () => { btn.classList.remove('on'); setSrc(tc, a, false); };
    btn.addEventListener('pointerdown', on);
    btn.addEventListener('pointerup', off); btn.addEventListener('pointercancel', off);
  });
  document.getElementById('tchip').addEventListener('pointerdown', e => { e.preventDefault(); pendingToggle = true; });
  document.getElementById('tmag').addEventListener('pointerdown', e => { e.preventDefault(); pendingMag = true; });
  document.getElementById('tset').addEventListener('pointerdown', e => { e.preventDefault(); togglePanel(); });
}

// =====================================================================
resize();
restartAll();
buildArt();
requestAnimationFrame(frame);
// 暴露给测试脚本
window.__game = { get boss3() { return boss3; }, get funcOn() { return funcOn; }, get funcOwned() { return funcOwned; }, get funcItem() { return funcItem; }, hurtBoss3(d) { damageBoss3(d, 1); }, get curveT() { return curveT; }, get boss2() { return boss2; }, get magOn() { return magOn; }, get magOwned() { return magOwned; }, get magItem() { return magItem; }, hurtBoss2(d) { damageBoss2(d, 1); }, teleport(i) { teleport(i); }, mag() { pendingMag = true; }, get boss() { return boss; }, get iceMode() { return iceMode; }, get chipOwned() { return chipOwned; }, get chipOn() { return chipOn; }, get chipItem() { return chipItem; }, toggle() { pendingToggle = true; }, hurtBoss(d) { damageBoss(d, 1); }, get player() { return player; }, get enemies() { return enemies; }, P, step, kb, pressed, setSrc, STEP };
</script>
